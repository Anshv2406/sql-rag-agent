services:
  postgres:
    image: postgres:16
    container_name: sql_rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: agent_pass
      POSTGRES_DB: chinook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/sample_db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_user -d chinook"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: